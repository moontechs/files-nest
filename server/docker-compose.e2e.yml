# =============================================================================
# iCloud Backup Server — E2E Test Stack
# =============================================================================
# Isolated Docker Compose stack for black-box end-to-end tests. Uses a
# separate Caddyfile (Caddyfile.e2e) and binds only to localhost on a
# configurable port so it never conflicts with the production stack.
#
# Usage:
#   E2E_HTTP_PORT=18080 \
#     BACKUP_USER=testuser \
#     BACKUP_PASS=testpass \
#     docker compose -f docker-compose.e2e.yml up -d
#
# Then run tests:
#   SERVER_URL=http://127.0.0.1:18080 \
#     BACKUP_USER=testuser \
#     BACKUP_PASS=testpass \
#     go test -tags=e2e ./e2e/
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Go iCloud Backup Server
  # ---------------------------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - BACKUP_USER=${BACKUP_USER}
      - BACKUP_PASS=${BACKUP_PASS}
      - STORAGE_PATH=/data
      - PORT=8080
    volumes:
      - server-data:/data
    expose:
      - "8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Caddy reverse proxy (plain HTTP for e2e)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${E2E_HTTP_PORT:-18080}:80"
    volumes:
      - ./Caddyfile.e2e:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - backend
    depends_on:
      server:
        condition: service_healthy

volumes:
  server-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  backend:
    driver: bridge
