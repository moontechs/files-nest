# =============================================================================
# iCloud Backup Server — Docker Compose
# =============================================================================
# Single service: the Go server binary. Caddy reverse proxy handles TLS
# termination and auto-HTTPS (Let's Encrypt). For LAN-only use, set
# DOMAIN to a local address or use Caddy's tls internal directive.
#
# Usage:
#   DOMAIN=backup.example.com \
#     BACKUP_USER=admin \
#     BACKUP_PASS=changeme \
#     docker compose up -d
#
# For local development without TLS:
#   DOMAIN=localhost \
#     BACKUP_USER=dev \
#     BACKUP_PASS=dev \
#     docker compose up
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Go iCloud Backup Server
  # ---------------------------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - BACKUP_USER=${BACKUP_USER}
      - BACKUP_PASS=${BACKUP_PASS}
      - STORAGE_PATH=/data
      - PORT=8080
    volumes:
      - server-data:/data
    expose:
      - "8080"
    ports:
      - "8080:8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Caddy reverse proxy — TLS termination + optional Let's Encrypt
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - backend
    depends_on:
      server:
        condition: service_healthy

volumes:
  server-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  backend:
    driver: bridge
